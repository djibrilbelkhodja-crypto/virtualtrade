<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VirtualTrade</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b16;--pan:#0e1424;--pan2:#151d33;--line:#1f2a45;--tx:#e8ecf7;--mu:#8a95b3;--up:#22c58b;--dn:#f0506e;--ac:#5b8cff;--am:#f5b73d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Sora,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{background:var(--pan);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:18px;padding:0 10px 22px;display:flex;gap:9px;align-items:center}
.brand i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--ac),var(--up));display:block}
nav a{display:block;padding:10px 12px;border-radius:9px;color:var(--mu);text-decoration:none;margin-bottom:2px;transition:background .15s,color .15s}
nav a:hover{background:var(--pan2);color:var(--tx)}
nav a.on{background:var(--pan2);color:var(--tx);box-shadow:inset 3px 0 var(--ac)}
main{padding:22px 26px 40px;max-width:1150px;width:100%}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:0 0 12px}
.sub{color:var(--mu);margin:0 0 18px}
.badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;background:#f5b73d22;color:var(--am);margin-bottom:14px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.grid4 .card{margin:0}
.lbl{color:var(--mu);font-size:12px}.big{font-size:22px;font-weight:700;margin-top:4px}
.up{color:var(--up)}.dn{color:var(--dn)}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.row{display:grid;grid-template-columns:2.2fr 1.2fr 1fr 1.2fr auto;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}.row:hover{background:#ffffff06}
.who{display:flex;gap:11px;align-items:center;min-width:0}
.logo{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:13px}
.who b{display:block}.who small{color:var(--mu)}
.tag{font-size:10px;color:var(--am);border:1px solid #f5b73d55;border-radius:5px;padding:0 4px;margin-left:5px}
.pill{padding:3px 8px;border-radius:7px;font-weight:600;font-size:12px;display:inline-block}
.pill.up{background:#22c58b1f}.pill.dn{background:#f0506e1f}
.btns{display:flex;gap:6px}
.b{padding:8px 14px;border-radius:8px;font-weight:600;transition:transform .1s,filter .15s}
.b:hover{filter:brightness(1.12)}.b:active{transform:scale(.96)}
.buy{background:var(--up);color:#04130d}.sell{background:var(--dn);color:#fff}.ghost{background:var(--pan2)}
svg{display:block;width:100%}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 6px;border-top:1px solid var(--line)}th{color:var(--mu);font-weight:400;border:0;font-size:12px}
.wrap{overflow-x:auto}
.empty{color:var(--mu);padding:18px 4px}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal.open{display:flex}
.sheet{background:var(--pan);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:440px;max-height:92vh;overflow:auto;animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 0}
.tabs button{padding:9px;border-radius:8px;background:var(--pan2);color:var(--mu)}
.tabs button.on.b1{background:var(--up);color:#04130d}.tabs button.on.b2{background:var(--dn);color:#fff}
input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px;color:var(--tx);font:inherit;font-size:16px}
.kv{display:flex;justify-content:space-between;color:var(--mu);margin:8px 0}.kv b{color:var(--tx)}
.err{color:var(--dn);min-height:20px;font-size:13px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--pan2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
@media(max-width:820px){
.app{grid-template-columns:1fr}
nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;z-index:40;display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line)}
nav a{flex:1;text-align:center;font-size:10.5px;padding:9px 2px;margin:0}nav a.on{box-shadow:inset 0 3px var(--ac)}.brand{display:none}
main{padding:16px 14px 96px}.grid4{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}
.row{grid-template-columns:1fr auto;grid-template-areas:"w p" "s b"}.row .who{grid-area:w}.row .pr{grid-area:p;text-align:right}.row .sp{grid-area:s}.row .btns{grid-area:b}.row .ch{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.tool input,.tool select{width:auto;flex:1 1 150px;min-width:0;background:var(--pan);border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--tx);font:inherit;font-size:14px}.tool .b.on{background:var(--am);color:#1a1200}
.star{background:none;color:var(--line);font-size:18px;padding:0 2px;transition:color .15s,transform .15s}.star.on{color:var(--am)}.star:hover{transform:scale(1.2)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}.chip{padding:5px 10px;border-radius:7px;background:var(--pan2);color:var(--mu);font-size:12px;transition:background .15s}.chip.on{background:var(--ac);color:#fff}
.tabs.t3 button.on{background:var(--ac);color:#fff}.two2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.recap{background:var(--pan2);border:1px solid var(--ac);border-radius:10px;padding:12px;margin:10px 0;line-height:1.7;animation:pop .18s}
.al{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.donut{width:130px;height:130px;border-radius:50%;position:relative;flex:none}.donut::after{content:"";position:absolute;inset:28px;background:var(--pan);border-radius:50%}
.lg{display:flex;align-items:center;gap:7px;margin:3px 0;color:var(--mu)}.lg i{width:10px;height:10px;border-radius:3px}.lg b{color:var(--tx);margin-left:auto;padding-left:12px}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}.row2:first-of-type{border-top:0}
#ch,#cw svg{border-radius:8px;background:#ffffff04}#cw polyline,#cw line{vector-effect:non-scaling-stroke}
th{position:sticky;top:0}tr:hover td{background:#ffffff05}
#toasts{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;z-index:70;pointer-events:none}
.toast{background:var(--pan2);border:1px solid var(--line);border-left:4px solid var(--ac);padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px #0008;animation:sl .25s ease-out;transition:opacity .3s}.toast.ok{border-left-color:var(--up)}.toast.err{border-left-color:var(--dn)}.toast.out{opacity:0}
@keyframes sl{from{transform:translateX(30px);opacity:0}}
@media(max-width:820px){#modal{align-items:flex-end;padding:0}.sheet{border-radius:18px 18px 0 0;max-height:94vh}#toasts{left:12px;right:12px}.tool input,.tool select{flex:1 1 100%}}
.logo{position:relative;overflow:hidden}.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.hd{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}.who2{display:flex;gap:10px;align-items:center}.av{font-size:24px}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0}.dot.on{border-color:var(--tx)}
.lbl{display:block;margin:14px 0 6px}.badge.okb{background:#22c58b22;color:var(--up)}.b:disabled{opacity:.4;cursor:not-allowed}
#ob{position:fixed;inset:0;background:var(--bg);display:none;overflow:auto;z-index:80;padding:24px 16px}#ob.open{display:block}.obc{max-width:520px;margin:0 auto}
.sheet.big{max-width:none;width:100%;height:100%;max-height:100vh;border-radius:0;display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:0 22px;align-content:start}.sheet.big .who{grid-column:1/-1}.sheet.big #cw{grid-column:1;grid-row:2}.sheet.big .side{grid-column:2;grid-row:2}
html[data-th=light]{--bg:#f3f5fa;--pan:#fff;--pan2:#eceff7;--line:#dbe1ee;--tx:#10182f;--mu:#5b6788;color-scheme:light}
html[data-th=oled]{--bg:#000;--pan:#0a0a0c;--pan2:#15151a;--line:#232329}
html[data-dn=compact] .card{padding:10px}html[data-dn=compact] .row{padding:6px 4px}html[data-dn=compact] main{padding-top:14px}
@media(max-width:820px){.sheet.big{display:block}nav a{font-size:10px;padding:9px 1px}}
.cwrap{position:relative}.mks{position:absolute;inset:0;pointer-events:none}.mk{position:absolute;transform:translate(-50%,-50%);font-size:14px;pointer-events:auto;cursor:help;filter:drop-shadow(0 0 2px #000)}.mk.buy{color:var(--up)}.mk.sell{color:var(--dn)}#toasts{z-index:99}
.pl{padding-left:18px;color:var(--mu);line-height:1.7}@media(max-width:820px){nav{overflow-x:auto}nav a{flex:1 0 auto;padding:9px 12px}}
</style></head><body>
<div class="app"><nav id="nav"></nav><main id="main"></main></div>
<div id="modal"></div><div id="ob"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const CUR={EUR:['€','eur'],USD:['$','usd'],GBP:['£','gbp']};let FXR={usd:1,eur:.92,gbp:.78},fxOk=0;
const cc=()=>S.set.cur||'EUR',FX=()=>FXR[CUR[cc()][1]];
const eur=n=>{const v=Math.abs(n*FX());return new Intl.NumberFormat('fr-FR',{style:'currency',currency:cc(),maximumFractionDigits:v>0&&v<.01?8:v<1?4:2}).format(n*FX())};
const pct=n=>(n>=0?'+':'')+n.toFixed(2).replace('.',',')+' %';
const cls=n=>n>=0?'up':'dn';
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const A=[],AM=new Map(),by=s=>AM.get(s),tk=s=>(by(s)||{}).tk||s;
const FEE=0.001,DS={name:'',emoji:'🦊',cur:'EUR',theme:'night',acc:'#5b8cff',dens:'cozy',monthly:0};
const newS=()=>({cash:0,inv:0,inv0:0,pos:{},tx:[],eq:[],orders:[],fav:[],meta:{},day:null,ob:0,lm:'',set:{...DS}});
let CURR='';try{CURR=localStorage.getItem('vtcur')||''}catch(e){}
const SKEY=()=>'vt2:'+CURR;
function loadS(){let x=newS();try{const r=localStorage.getItem(SKEY());if(r)x=Object.assign(x,JSON.parse(r))}catch(e){}x.set=Object.assign({},DS,x.set);return x}
let S=CURR?loadS():newS();
const save=()=>{if(!CURR)return;try{localStorage.setItem(SKEY(),JSON.stringify(S))}catch(e){}};
const hv=()=>Object.entries(S.pos).reduce((t,[s,q])=>t+q.qty*((by(s)||{}).p||q.last||0),0);
const total=()=>S.cash+hv();
function snap(){const t=Date.now(),L=S.eq[S.eq.length-1];if(!L||t-L[0]>3e5)S.eq.push([t,total()]);else L[1]=total();if(S.eq.length>2000)S.eq=S.eq.filter((_,i)=>i%2==0);save()}
function line(pts,h,col){if(pts.length<2)return'<div class="empty">Le graphique apparaît après quelques secondes.</div>';const w=600,mn=Math.min(...pts),mx=Math.max(...pts),r=(mx-mn)||1;const d=pts.map((v,i)=>(i/(pts.length-1)*w).toFixed(1)+','+(h-4-(v-mn)/r*(h-8)).toFixed(1));const id='g'+Math.random().toString(36).slice(2,7);
return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><polygon points="0,${h} ${d.join(' ')} ${w},${h}" fill="url(#${id})"/><polyline points="${d.join(' ')}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
const chg=a=>a.ch||0;
const logo=a=>`<span class="logo" style="background:${a.c}">${a.img?`<img src="${a.img}" alt="" loading="lazy" onerror="this.remove()">`:''}${a.l}</span>`;
const fd=t=>new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:C.per>=3?'numeric':undefined})+(C.per<2?' '+new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'');
const colr=n=>n>=0?'#22c58b':'#f0506e';
const F={q:'',sort:'rk',fav:0},H={s:'',from:'',to:'',q:''},C={type:'line',per:2,ma:0,rsi:0},PER=[['1J',1],['7J',7],['1M',30],['3M',90],['1A',365],['Max','max']];let BIG=0;
function row(a){const c=chg(a),lv=a.live;return`<div class="row" data-open="${a.s}"><div class="who"><button class="star ${S.fav.includes(a.s)?'on':''}" data-fav="${a.s}" aria-label="Favori">★</button>${logo(a)}<span><b>${a.n}${lv?'':'<span class="tag">'+(a.t=='a'&&!KEY()&&!PROXY?'Clé Finnhub requise':'Hors ligne')+'</span>'}${a.closed&&lv?'<span class="tag">Marché fermé</span>':''}</b><small>${a.tk}</small></span></div><div class="pr"><b>${a.p>0?eur(a.p):'-'}</b></div><div class="ch">${lv?`<span class="pill ${cls(c)}">${c>=0?'▲':'▼'} ${pct(c)}</span>`:''}</div><div class="sp">${a.h.length>1?line(a.h.slice(-24),34,colr(c)):''}</div><div class="btns"><button class="b buy" data-t="buy|${a.s}"${lv?'':' disabled'}>Acheter</button><button class="b sell" data-t="sell|${a.s}"${lv?'':' disabled'}>Vendre</button></div></div>`}
function visible(){const o={rk:(x,y)=>x.rk-y.rk,name:(x,y)=>x.n.localeCompare(y.n),pa:(x,y)=>x.p-y.p,pd:(x,y)=>y.p-x.p,ca:(x,y)=>chg(x)-chg(y),cd:(x,y)=>chg(y)-chg(x)};return A.filter(a=>(!F.fav||S.fav.includes(a.s))&&(a.n+' '+a.tk).toLowerCase().includes(F.q.toLowerCase())).sort(o[F.sort])}
let LF=()=>1;
const mlist=f=>{const v=visible().filter(f);return(v.slice(0,SHOW).map(row).join('')||'<div class="empty">Aucun actif ne correspond. Essayez une autre recherche.</div>')+((v.length>SHOW||(PAGE<6&&f({t:'c'})))?'<button class="b ghost" data-more="1" style="margin:12px auto 0;display:block">Afficher plus</button>':'')};
const list=f=>{LF=f;return`<div class="tool"><input id="q" placeholder="Rechercher un actif…" value="${F.q}"><select id="so">${[['rk','Capitalisation'],['name','Nom'],['pa','Prix ↑'],['pd','Prix ↓'],['ca','24 h ↑'],['cd','24 h ↓']].map(([k,n])=>`<option value="${k}"${F.sort==k?' selected':''}>${n}</option>`).join('')}</select><button class="b ghost ${F.fav?'on':''}" data-favf="1">★ Favoris</button></div><div class="card" id="ml">${mlist(f)}</div>`};
function status(){const L=A.filter(a=>a.live).length;let h=`<span class="badge ${L?'okb':''}">${L?'● Cours réels : '+L+' actifs · CoinGecko'+(KEY()||PROXY?' + Finnhub':''):'Connexion aux marchés…'}</span>`;if(ST.cg)h+=` <span class="badge">${ST.cg}</span>`;if(ST.fh)h+=` <span class="badge">${ST.fh}</span>`;if(!fxOk)h+=' <span class="badge">Taux de change indisponible : conversions approximatives</span>';if(!KEY()&&!PROXY)h+=' <button class="b ghost" data-key="1" style="padding:3px 10px;margin-bottom:14px">Activer les actions (clé Finnhub gratuite)</button>';return h}
function txTable(t){return t.length?`<div class="wrap"><table><tr><th>Date</th><th>Type</th><th>Ordre</th><th>Actif</th><th>Montant</th><th>Quantité</th><th>Prix</th><th>Frais</th><th>Résultat</th></tr>${t.map(x=>`<tr><td>${new Date(x.d).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})}</td><td class="${x.k=='buy'?'up':'dn'}">${x.k=='buy'?'Achat':'Vente'}</td><td>${x.o||'Marché'}</td><td>${tk(x.s)}</td><td>${eur(x.e)}</td><td>${x.q.toFixed(6)}</td><td>${eur(x.p)}</td><td>${eur(x.f||0)}</td><td class="${x.r>=0?'up':'dn'}">${x.k=='sell'?eur(x.r):'-'}</td></tr>`).join('')}</table></div>`:'<div class="empty">Aucune transaction à afficher.</div>'}
function holdings(){const e=Object.entries(S.pos);return e.length?`<div class="wrap"><table><tr><th>Actif</th><th>Quantité</th><th>Prix moyen</th><th>Prix actuel</th><th>Valeur</th><th>Gain latent</th><th>SL / TP</th><th></th></tr>${e.map(([s,q])=>{const a=by(s),v=q.qty*a.p,pl=v-q.cost;return`<tr><td><b>${tk(s)}</b></td><td>${q.qty.toFixed(6)}</td><td>${eur(q.cost/q.qty)}</td><td>${eur(a.p)}</td><td>${eur(v)}</td><td class="${cls(pl)}">${eur(pl)} (${pct(pl/q.cost*100)})</td><td>${q.sl?eur(q.sl):'-'} / ${q.tp?eur(q.tp):'-'}</td><td><button class="b ghost" data-t="sell|${s}">Vendre</button></td></tr>`}).join('')}</table></div>`:'<div class="empty">Votre portefeuille est vide. Choisissez un actif dans Marchés.</div>'}
function stats(){const v=total(),pl=v-S.inv,d=v-(S.day?S.day.v:v);return`<div class="grid4">${[['Valeur totale',eur(v),''],['Solde disponible',eur(S.cash),''],['Bénéfices / pertes',eur(pl),cls(pl)],['Performance globale',pct(S.inv?pl/S.inv*100:0),cls(pl)],['Gain du jour',eur(d),cls(d)]].map(([l,x,c])=>`<div class="card"><div class="lbl">${l}</div><div class="big ${c}">${x}</div></div>`).join('')}</div>`}
const eqChart=()=>{const p=S.eq.map(x=>x[1]);return`<div class="kv"><span>Plus bas <b>${eur(Math.min(...p))}</b></span><span>Plus haut <b>${eur(Math.max(...p))}</b></span></div>`+line(p,220,colr(total()-S.inv))};
function alloc(){const it=Object.entries(S.pos).map(([s,q])=>[tk(s),q.qty*(by(s).p||q.last||0),by(s).c]);it.push(['Cash',S.cash,'#3a4a75']);const T=it.reduce((t,x)=>t+x[1],0)||1;let c=0;const g=it.map(x=>{const a=c;c+=x[1]/T*100;return`${x[2]} ${a}% ${c}%`}).join(',');return`<div class="al"><div class="donut" style="background:conic-gradient(${g})"></div><div>${it.map(x=>`<div class="lg"><i style="background:${x[2]}"></i>${x[0]} <b>${(x[1]/T*100).toFixed(1)} %</b></div>`).join('')}</div></div>`}
const movers=()=>A.filter(a=>a.live&&a.rk<=100).sort((x,y)=>chg(y)-chg(x)).slice(0,4).map(a=>`<div class="row2" data-open="${a.s}"><span class="who">${logo(a)}<b>${a.n}</b></span><span>${eur(a.p)}</span><span class="pill ${cls(chg(a))}">${pct(chg(a))}</span></div>`).join('');

const hfilter=()=>S.tx.filter(x=>(!H.s||x.s==H.s)&&(!H.from||x.d>=new Date(H.from).getTime())&&(!H.to||x.d<=new Date(H.to).getTime()+864e5-1)&&(tk(x.s)+' '+((by(x.s)||{}).n||'')+' '+(x.k=='buy'?'achat':'vente')+' '+(x.o||'marché')).toLowerCase().includes(H.q.toLowerCase()));

if(d.open)return openM(d.open,'buy');
if(d.side){M.side=d.side;return drawM()}
if(d.ot){M.ot=d.ot;return drawM()}
if(d.c){const[k,v]=d.c.split(':');C[k]=k=='type'?v:+v;return drawC()}
if(d.cx){S.orders=S.orders.filter(o=>o.id!=d.cx);save();render();return toast('Ordre annulé')}
if(d.csv)return csv();
if(d.reset){if(confirm('Réinitialiser le compte et effacer l’historique ?')){const st=S.set,fv=S.fav;S=newS();S.set=st;S.fav=fv;save();drawOb();render()}return}
if(d.p){const[k,v]=d.p.split('|');if(k=='mon'){S.set.monthly=(+v)/FX();S.lm=ym()}else S.set[k]=v;save();apply();if(!S.ob)drawOb();else render();return}
if(d.am){AUTH.mode=AUTH.mode=='signup'?'login':'signup';AUTH.err='';return drawAuth()}
if(d.auth)return auth();
if(d.guest)return start('guest','');
if(d.soon)return toast(d.soon+' : connexion indisponible sans serveur. Créez un compte local ou continuez sans compte.','err');
if(d.logout){CURR='';try{localStorage.removeItem('vtcur')}catch(e){}S=newS();apply();AUTH.mode='login';drawAuth();render();return}
if(d.bud){OB.budget=+d.bud;return drawOb()}
if(d.mon){OB.mon=+d.mon;return drawOb()}
if(d.go){const b=Math.max(1,OB.budget||10000)/FX();Object.assign(S,{inv:b,inv0:b,cash:b,ob:1,lm:ym(),eq:[[Date.now(),b]],day:{d:new Date().toDateString(),v:b}});S.set.monthly=(OB.mon||0)/FX();save();$('#ob').className='';render();toast('Bienvenue'+(S.set.name?' '+S.set.name:'')+' !','ok');return}
if(d.big){BIG=!BIG;const sh=$('.sheet');if(sh)sh.classList.toggle('big',BIG);const m=$('#modal');if(BIG&&m.requestFullscreen)m.requestFullscreen().catch(()=>{});else if(!BIG&&document.fullscreenElement)document.exitFullscreen();return drawC()}
if(d.more){SHOW+=50;const upd=()=>{if($('#ml'))$('#ml').innerHTML=mlist(LF)};upd();if(SHOW>visible().filter(LF).length&&PAGE<6)loadPage(PAGE+1).then(upd);return}
if(t.id=='ok')return trade();if(t.id=='cancel')return closeM();
if(t.id=='max'){const a=by(M.s),q=S.pos[M.s];$('#amt').value=M.side=='buy'?Math.floor(S.cash/(1+FEE)*FX()*100)/100:(q?(q.qty*a.p*FX()).toFixed(2):0);prev()}});
document.addEventListener('input',ev=>{const i=ev.target.id;if(['amt','lim','sl','tp'].includes(i))prev();if(i=='q'){F.q=ev.target.value;$('#ml').innerHTML=mlist(LF);clearTimeout(ST.t);if(F.q.length>=2)ST.t=setTimeout(()=>rsearch(F.q),700)}if(i=='pn'){S.set.name=ev.target.value;save()}if(i=='pb')OB.budget=parseFloat(ev.target.value)||0;if(i=='hq'){H.q=ev.target.value;$('#hx').innerHTML=txTable(hfilter())}});
document.addEventListener('change',ev=>{const i=ev.target.id,m={hs:'s',hf:'from',hz:'to'};if(i=='so'){F.sort=ev.target.value;$('#ml').innerHTML=mlist(LF)}if(m[i]){H[m[i]]=ev.target.value;$('#hx').innerHTML=txTable(hfilter())}});
document.addEventListener('pointermove',ev=>{const sv=ev.target.closest&&ev.target.closest('#ch');if(!sv||!CP.length)return;const r=sv.getBoundingClientRect(),n=CP.length,i=Math.min(n-1,Math.max(0,Math.floor((ev.clientX-r.left)/r.width*n))),x=(i+.5)/n*600,l=$('#cx'),p=CP[i];l.setAttribute('x1',x);l.setAttribute('x2',x);l.style.display='';$('#hv').innerHTML=fd(p[0])+' · <b>'+eur(p[4])+'</b> ('+pct((p[4]/CP[0][4]-1)*100)+')'+(C.type=='candle'?'<br>O '+eur(p[1])+' H '+eur(p[2])+' B '+eur(p[3])+' C '+eur(p[4]):'')});
document.addEventListener('keydown',ev=>{if(ev.key=='Escape')closeM()});
addEventListener('hashchange',render);
// Prix : tentative CoinGecko, sinon démo (random walk léger)
const CG='https://api.coingecko.com/api/v3',ST={cg:'',fh:'',t:0},STK=['AAPL|Apple','MSFT|Microsoft','NVDA|NVIDIA','AMZN|Amazon','GOOGL|Alphabet','META|Meta','TSLA|Tesla','NFLX|Netflix','AMD|AMD','INTC|Intel','JPM|JPMorgan','V|Visa','MA|Mastercard','WMT|Walmart','KO|Coca-Cola','MCD|McDonald’s','DIS|Disney','NKE|Nike','PYPL|PayPal','UBER|Uber','COIN|Coinbase','BA|Boeing','XOM|Exxon Mobil','PFE|Pfizer'];
let PAGE=0,SHOW=50,DIRTY=1,HC={},OB={budget:10000,mon:0};
const KEY=()=>{try{return localStorage.getItem('vtkey')||''}catch(e){return''}};
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return'hsl('+h+',50%,40%)'};
const jget=async u=>{const r=await fetch(u);if(!r.ok)throw r.status;return r.json()};
const ym=()=>new Date().toISOString().slice(0,7);
function up(o){let a=AM.get(o.s);if(!a){a={h:[],ch:0,p:0,ts:0,rk:99999,get live(){return this.p>0&&Date.now()-this.ts<3e5}};AM.set(o.s,a);A.push(a)}return Object.assign(a,o)}
const upC=x=>up({s:'c:'+x.id,t:'c',id:x.id,tk:(x.symbol||'').toUpperCase(),n:x.name,img:x.image,l:(x.symbol||'?')[0].toUpperCase(),c:hue(x.id),p:x.current_price||0,ch:x.price_change_percentage_24h||0,h:(x.sparkline_in_7d&&x.sparkline_in_7d.price)||[],rk:x.market_cap_rank||99999,ts:Date.now()});
const upS=(t,n,rk)=>up({s:'s:'+t,t:'a',tk:t,n,l:t[0],c:hue(t),img:'https://static2.finnhub.io/file/publicdatany/finnhubimage/stock_logo/'+t+'.png',rk:rk||99999});
const MK='&sparkline=true&price_change_percentage=24h';
async function loadPage(n){try{(await jget(CG+'/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page='+n+MK)).forEach(upC);if(n>PAGE)PAGE=n;ST.cg='';DIRTY=1}catch(e){ST.cg=e==429?'CoinGecko : limite atteinte, nouvel essai dans 1 min':'CoinGecko indisponible'}}
async function refreshIds(){const ids=[...new Set([...Object.keys(S.pos),...S.fav,...S.orders.map(o=>o.s),...(M?[M.s]:[])])].filter(k=>k[0]=='c').map(k=>k.slice(2));if(!ids.length)return;try{(await jget(CG+'/coins/markets?vs_currency=usd&ids='+ids.join(',')+MK)).forEach(upC);DIRTY=1}catch(e){}}
async function refreshC(){for(let n=1;n<=Math.max(PAGE,1);n++)await loadPage(n);await refreshIds()}
let PROXY=0;
async function quote(a,k){const q=PROXY?(await jget('/.netlify/functions/quote?symbols='+a.tk))[a.tk]:await jget('https://finnhub.io/api/v1/quote?symbol='+a.tk+'&token='+k);if(q&&q.c>0){a.p=q.c;a.ch=q.dp||0;a.ts=Date.now();a.closed=Date.now()/1e3-q.t>1800}}
async function viaProxy(){const st=A.filter(a=>a.t=='a').slice(0,55),d=await jget('/.netlify/functions/quote?symbols='+st.map(a=>a.tk).join(','));if(typeof d!='object'||d.error)throw 0;st.forEach(a=>{const q=d[a.tk];if(q&&q.c>0){a.p=q.c;a.ch=q.dp||0;a.ts=Date.now();a.closed=Date.now()/1e3-q.t>1800}});PROXY=1;ST.fh='';DIRTY=1}
async function refreshS(){try{await viaProxy();return}catch(e){PROXY=0}const k=KEY();if(!k)return;for(const a of A.filter(a=>a.t=='a').slice(0,55)){try{await quote(a,k);ST.fh=''}catch(e){ST.fh=e==401||e==403?'Clé Finnhub refusée':e==429?'Finnhub : limite atteinte':'Finnhub indisponible';if(e==401||e==403||e==429)break}}DIRTY=1}
const fsrch=q=>PROXY?jget('/.netlify/functions/quote?q='+encodeURIComponent(q)):jget('https://finnhub.io/api/v1/search?q='+encodeURIComponent(q)+'&token='+KEY());
async function rsearch(q){try{const ids=(await jget(CG+'/search?query='+encodeURIComponent(q))).coins.slice(0,8).map(c=>c.id);if(ids.length)(await jget(CG+'/coins/markets?vs_currency=usd&ids='+ids.join(',')+MK)).forEach(upC)}catch(e){}
const k=KEY();if(k||PROXY)try{for(const r of(await fsrch(q)).result.filter(r=>r.type=='Common Stock'&&!/[.:]/.test(r.symbol)).slice(0,6)){const a=AM.get('s:'+r.symbol)||upS(r.symbol,r.description.toLowerCase().replace(/(^|\s)\w/g,m=>m.toUpperCase()));try{await quote(a,k)}catch(e){}}}catch(e){}
if($('#ml'))$('#ml').innerHTML=mlist(LF)}
async function fx(){try{const r=(await jget(CG+'/exchange_rates')).rates,u=r.usd.value;FXR={usd:1,eur:r.eur.value/u,gbp:r.gbp.value/u};fxOk=1}catch(e){fxOk=0}}
const apply=()=>{const r=document.documentElement,t=S.set;r.dataset.th=t.theme;r.dataset.dn=t.dens;r.style.setProperty('--ac',t.acc)};
const chips=(k,arr,cur)=>arr.map(([v,t])=>`<button class="chip ${cur==v?'on':''}" data-p="${k}|${v}">${t}</button>`).join('');
const ch2=(a,arr,cur)=>arr.map(v=>`<button class="chip ${cur==v?'on':''}" data-${a}="${v}">${v.toLocaleString('fr-FR')}</button>`).join('');
function prefs(){const t=S.set;return`<label class="lbl">Nom</label><input id="pn" value="${t.name}" placeholder="Votre prénom" maxlength="20"><label class="lbl">Avatar</label><div class="chips">${chips('emoji',['🦊','🐯','🦁','🐼','🚀','💎','🧠','🌙'].map(e=>[e,e]),t.emoji)}</div><label class="lbl">Devise</label><div class="chips">${chips('cur',[['EUR','€ Euro'],['USD','$ Dollar'],['GBP','£ Livre']],t.cur)}</div><label class="lbl">Couleur</label><div class="chips">${['#5b8cff','#22c58b','#f5b73d','#c06bff','#ff7a59','#2ec4d6'].map(c=>`<button class="dot ${t.acc==c?'on':''}" style="background:${c}" data-p="acc|${c}" aria-label="${c}"></button>`).join('')}</div><label class="lbl">Thème</label><div class="chips">${chips('theme',[['night','Nuit'],['oled','Noir'],['light','Clair']],t.theme)}</div><label class="lbl">Affichage</label><div class="chips">${chips('dens',[['cozy','Aéré'],['compact','Compact']],t.dens)}</div>`}
function drawOb(){const b=$('#ob');b.className='open';b.innerHTML=`<div class="obc"><h1>Bienvenue sur VirtualTrade</h1><p class="sub">Investissez de l’argent virtuel avec de vrais cours. Configurez votre compte.</p>${prefs()}<label class="lbl">Budget de départ (${CUR[cc()][0]})</label><div class="chips">${ch2('bud',[1000,5000,10000,50000,100000],OB.budget)}</div><input id="pb" type="number" inputmode="decimal" min="1" value="${OB.budget}" style="margin-top:8px"><label class="lbl">Versement virtuel chaque mois (${CUR[cc()][0]})</label><div class="chips">${ch2('mon',[0,100,500,1000],OB.mon)}</div>${fxOk?'':'<p class="sub">Taux de change indisponible : conversions approximatives.</p>'}<button class="b buy" data-go="1" style="width:100%;margin-top:18px;padding:13px">Commencer</button></div>`}
let AUTH={mode:'signup',err:''};
const AC=()=>{try{return JSON.parse(localStorage.getItem('vtacc')||'{}')}catch(e){return{}}};
async function hs(p,salt){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of salt+p)h=(h*33+c.charCodeAt(0))>>>0;return'w'+h}}
function drawAuth(){const b=$('#ob'),su=AUTH.mode=='signup';b.className='open';b.innerHTML=`<div class="obc"><h1>${su?'Créer un compte':'Connexion'}</h1><p class="sub">Compte enregistré uniquement sur cet appareil. Aucun argent réel.</p><div class="chips"><button class="chip" data-soon="Google">Google</button><button class="chip" data-soon="Apple">Apple</button><button class="chip" data-soon="Outlook">Outlook</button></div><p class="sub" style="font-size:12px">Google, Apple et Outlook : nécessitent un serveur, indisponible dans ce fichier.</p>${su?'<label class="lbl">Prénom</label><input id="an" maxlength="20" autocomplete="given-name">':''}<label class="lbl">E-mail</label><input id="ae" type="email" autocomplete="email"><label class="lbl">Mot de passe</label><input id="ap" type="password" autocomplete="${su?'new-password':'current-password'}"><div class="err">${AUTH.err}</div><button class="b buy" data-auth="1" style="width:100%;padding:13px">${su?'Créer mon compte':'Se connecter'}</button><button class="b ghost" data-am="1" style="width:100%;margin-top:8px">${su?'J’ai déjà un compte':'Créer un compte'}</button><button class="chip" data-guest="1" style="margin-top:12px">Continuer sans compte</button></div>`}
const fail=m=>{AUTH.err=m;drawAuth()};
async function auth(){const e=($('#ae').value||'').trim().toLowerCase(),pw=$('#ap').value||'',su=AUTH.mode=='signup',ac=AC();
if(!/^\S+@\S+\.\S+$/.test(e))return fail('E-mail invalide.');if(pw.length<6)return fail('Mot de passe : 6 caractères minimum.');
if(su){if(ac[e])return fail('Un compte existe déjà avec cet e-mail.');const salt=Math.random().toString(36).slice(2);ac[e]={salt,h:await hs(pw,salt)};try{localStorage.setItem('vtacc',JSON.stringify(ac))}catch(x){}start(e,($('#an')&&$('#an').value)||'')}
else{const a=ac[e];if(!a||a.h!=await hs(pw,a.salt))return fail('E-mail ou mot de passe incorrect.');start(e,'')}}
function start(id,name){CURR=id;try{localStorage.setItem('vtcur',id)}catch(e){}S=loadS();if(name&&!S.set.name)S.set.name=name;AUTH.err='';save();enter()}
function enter(){apply();for(const k in S.meta){const m=S.meta[k];up({s:k,t:m.t,id:m.id,tk:m.tk,n:m.n,img:m.img,l:(m.tk||'?')[0],c:hue(k),p:(S.pos[k]&&S.pos[k].last)||0})}if(!S.ob)drawOb();else{$('#ob').className='';monthly()}render();refreshIds()}
function monthly(){if(!S.set.monthly){S.lm=ym();return}const[a,b]=S.lm.split('-').map(Number),[c,d]=ym().split('-').map(Number),n=(c-a)*12+d-b;if(n>0){const x=S.set.monthly*n;S.cash+=x;S.inv+=x;S.lm=ym();save();toast('Versement mensuel : +'+eur(x),'ok')}}
function tick(){Object.entries(S.pos).forEach(([s,q])=>{const a=by(s);if(a&&a.p>0)q.last=a.p});if(S.ob){checkOrders();if(Object.keys(S.pos).every(k=>by(k)&&by(k).p>0))snap()}const f=document.activeElement;if(M)drawQuote();else if(DIRTY&&S.ob&&!(f&&f.closest&&f.closest('main')&&/INPUT|SELECT/.test(f.tagName))){DIRTY=0;render()}}
async function boot(){apply();STK.forEach((x,i)=>{const[t,n]=x.split('|');if(!AM.get('s:'+t))upS(t,n,(i+1)*3)});
render();await fx();if(!CURR)drawAuth();else enter();
refreshC().then(()=>render());refreshS();
setInterval(()=>{refreshC();refreshS()},6e4);setInterval(fx,6e5);setInterval(tick,1e4)}
boot();
</script></body></html>
